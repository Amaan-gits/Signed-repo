// 📁 C:\Users\Ayaan1\AndroidStudioProjects\UltimateAccessApp\app\build.gradle

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultimate.access'
    compileSdk 36

    // 🔥 SIGNING CONFIG
    signingConfigs {
        release {
            storeFile file("C:\\Users\\Ayaan1\\keystore\\ultimate.jks")
            storePassword "ultimate123"
            keyAlias "ultimate"
            keyPassword "ultimate123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.ultimate.access"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "7.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 🔥 ADD THIS - for vector drawables support
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Android Core
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Google Play Services
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Retrofit - API Calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // WebSocket
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'

    // Cloudinary
    implementation 'com.cloudinary:cloudinary-android:2.3.1'

    // 🔥 OPTIONAL: Glide for image loading (if needed)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // 🔥 RECOMMENDED: For Base64 image handling
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}